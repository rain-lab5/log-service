services:

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://logservice:logservice@postgres:5432/logservice


  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: logservice
      POSTGRES_PASSWORD: logservice
      POSTGRES_DB: logservice
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data: